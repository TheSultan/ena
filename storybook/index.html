<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Magical Day in Ponyville</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      padding: 20px;
      background: #1a0a2e;
      overflow: hidden;
    }

    /* Stars background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, white 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1px);
      background-size: 120px 120px, 80px 80px, 50px 50px;
      background-position: 0 0, 40px 40px, 20px 20px;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Book */
    #book {
      position: relative;
      width: 820px;
      min-height: 480px;
      background: white;
      border-radius: 6px 28px 28px 6px;
      box-shadow:
        -8px 0 0 #c8a97e,
        -14px 0 0 #a07850,
        0 12px 48px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 8px solid #e0c89a;
    }

    /* Page transition */
    #page {
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: page-turn 0.5s ease both;
    }

    @keyframes page-turn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Scene illustration */
    #scene {
      position: relative;
      height: 310px;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Text area */
    #text-area {
      padding: 20px 32px 14px;
      flex: 1;
      background: #fffdf6;
      border-top: 2px solid #e8dcc8;
    }

    #story-text {
      font-size: 1.25rem;
      color: #3e2a14;
      line-height: 1.7;
      text-align: center;
    }

    /* Footer */
    #footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 14px;
      background: #fffdf6;
    }

    #page-num {
      font-size: 0.85rem;
      color: #a07850;
      font-style: italic;
    }

    .nav-btn {
      background: #ab47bc;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }

    .nav-btn:hover:not(:disabled) { transform: scale(1.07); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    /* Character images on scene */
    .char-img {
      position: absolute;
      object-fit: contain;
      bottom: 0;
      animation: char-appear 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes char-appear {
      from { transform: scale(0) translateY(30px); opacity: 0; }
      to   { transform: scale(1) translateY(0);   opacity: 1; }
    }

    /* Title page special */
    .title-scene {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    .title-scene h2 {
      font-size: 2.2rem;
      color: #7b1fa2;
      text-shadow: 1px 2px 0 rgba(255,255,255,0.7);
      text-align: center;
      line-height: 1.3;
      z-index: 1;
    }

    .title-scene .subtitle {
      font-size: 1rem;
      color: #9c27b0;
      font-style: italic;
      z-index: 1;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -12px;
      border-radius: 3px;
      animation: fall linear forwards;
      z-index: 20;
      pointer-events: none;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="book">
    <div id="page">
      <div id="scene"></div>
      <div id="text-area">
        <p id="story-text"></p>
      </div>
      <div id="footer">
        <button class="nav-btn" id="prev-btn">← Back</button>
        <span id="page-num"></span>
        <button class="nav-btn" id="next-btn">Next →</button>
      </div>
    </div>
  </div>

  <script>
    const IMGS = {
      twilight:   '../tictactoe/images/twilight.png',
      luna:       '../tictactoe/images/luna.png',
      celestia:   '../tictactoe/images/celestia.png',
      applejack:  '../tictactoe/images/applejack.png',
      sunset:     '../tictactoe/images/sunset.png',
      starlight:  '../tictactoe/images/starlight.png',
      trixie:     '../tictactoe/images/trixie.png',
      fluttershy: '../tictactoe/images/fluttershy.png',
      rarity:     '../tictactoe/images/rarity.png',
      cadance:    '../tictactoe/images/cadance.png',
    };

    const CONFETTI_COLORS = ['#ff6f61','#ffd200','#6dd5ed','#a8e063','#f7971e','#c471ed','#12c2e9'];

    // Each page: bg (CSS), characters [{key, size, left, delay}], text
    const PAGES = [
      {
        bg: 'linear-gradient(180deg, #7e57c2 0%, #ba68c8 50%, #f8bbd9 75%, #a5d6a7 75%, #66bb6a 100%)',
        titlePage: true,
        title: 'A Magical Day\nin Ponyville',
        subtitle: 'A story for Ena 🌟',
        chars: [
          { key: 'twilight',   size: 110, left: '12%',  delay: 0.1 },
          { key: 'luna',       size: 120, left: '30%',  delay: 0.2 },
          { key: 'celestia',   size: 130, left: '50%',  delay: 0.15 },
          { key: 'fluttershy', size: 100, left: '68%',  delay: 0.25 },
          { key: 'rarity',     size: 105, left: '84%',  delay: 0.3  },
        ],
        text: '',
      },
      {
        bg: 'linear-gradient(180deg, #90caf9 0%, #bbdefb 55%, #a5d6a7 55%, #81c784 100%)',
        chars: [
          { key: 'twilight', size: 160, left: '30%', delay: 0 },
        ],
        text: 'It was a beautiful morning in Ponyville. Twilight Sparkle sat under a big oak tree, reading her favourite book about stars and magic.',
      },
      {
        bg: 'linear-gradient(180deg, #80deea 0%, #b2ebf2 55%, #c8e6c9 55%, #a5d6a7 100%)',
        chars: [
          { key: 'fluttershy', size: 150, left: '20%', delay: 0 },
          { key: 'twilight',   size: 130, left: '55%', delay: 0.15 },
        ],
        text: 'Suddenly, Fluttershy came running through the flowers. "Twilight! Something magical is happening — come and see!"',
      },
      {
        bg: 'linear-gradient(180deg, #ce93d8 0%, #e1bee7 50%, #f8bbd9 50%, #fce4ec 100%)',
        chars: [
          { key: 'applejack', size: 120, left: '5%',  delay: 0 },
          { key: 'rarity',    size: 120, left: '25%', delay: 0.1 },
          { key: 'starlight', size: 120, left: '45%', delay: 0.15 },
          { key: 'trixie',    size: 120, left: '65%', delay: 0.2 },
          { key: 'sunset',    size: 120, left: '80%', delay: 0.25 },
        ],
        text: 'They called all their friends. Applejack, Rarity, Starlight, Trixie, and Sunset Shimmer all came running! Everyone wanted to see the surprise.',
      },
      {
        bg: 'linear-gradient(180deg, #7e57c2 0%, #9575cd 40%, #b39ddb 40%, #d1c4e9 100%)',
        chars: [
          { key: 'luna',     size: 160, left: '15%', delay: 0 },
          { key: 'celestia', size: 170, left: '50%', delay: 0.15 },
        ],
        text: 'In the meadow, Princess Luna and Princess Celestia were waiting — and above them stretched the most enormous, sparkling rainbow anypony had ever seen!',
      },
      {
        bg: 'linear-gradient(180deg, #f06292 0%, #f48fb1 45%, #fce4ec 45%, #fff9c4 100%)',
        chars: [
          { key: 'cadance', size: 150, left: '20%', delay: 0 },
          { key: 'sunset',  size: 130, left: '55%', delay: 0.15 },
        ],
        text: 'Princess Cadance and Sunset Shimmer danced and twirled under the rainbow. Everyone laughed, sang, and played together all afternoon long.',
      },
      {
        bg: 'linear-gradient(180deg, #1a0a2e 0%, #4a148c 50%, #1b5e20 50%, #2e7d32 100%)',
        nightPage: true,
        chars: [
          { key: 'twilight',   size: 85, left: '3%',  delay: 0.05 },
          { key: 'luna',       size: 90, left: '14%', delay: 0.1  },
          { key: 'celestia',   size: 90, left: '25%', delay: 0.15 },
          { key: 'applejack',  size: 80, left: '36%', delay: 0.2  },
          { key: 'sunset',     size: 80, left: '46%', delay: 0.25 },
          { key: 'starlight',  size: 80, left: '56%', delay: 0.3  },
          { key: 'trixie',     size: 80, left: '66%', delay: 0.35 },
          { key: 'fluttershy', size: 80, left: '74%', delay: 0.4  },
          { key: 'rarity',     size: 85, left: '83%', delay: 0.45 },
          { key: 'cadance',    size: 85, left: '91%', delay: 0.5  },
        ],
        text: 'As the first star appeared in the night sky, all ten friends made a wish together. "We\'ll be friends forever!" they said.\n\n✨ The End ✨',
        isLast: true,
      },
    ];

    let current = 0;
    const sceneEl   = document.getElementById('scene');
    const textEl    = document.getElementById('story-text');
    const pageNumEl = document.getElementById('page-num');
    const prevBtn   = document.getElementById('prev-btn');
    const nextBtn   = document.getElementById('next-btn');
    const pageEl    = document.getElementById('page');

    function render(idx) {
      const p = PAGES[idx];

      // Animate page
      pageEl.style.animation = 'none';
      pageEl.offsetWidth; // reflow
      pageEl.style.animation = '';

      // Scene background
      sceneEl.style.background = p.bg;

      // Build scene content
      sceneEl.innerHTML = '';

      if (p.titlePage) {
        const div = document.createElement('div');
        div.className = 'title-scene';
        div.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;';
        div.innerHTML = `<h2>${p.title.replace('\n', '<br>')}</h2><span class="subtitle">${p.subtitle}</span>`;
        sceneEl.appendChild(div);
      }

      p.chars.forEach(c => {
        const img = document.createElement('img');
        img.src = IMGS[c.key];
        img.alt = c.key;
        img.className = 'char-img';
        img.style.width  = c.size + 'px';
        img.style.height = c.size + 'px';
        img.style.left   = c.left;
        img.style.animationDelay = c.delay + 's';
        if (p.nightPage) img.style.filter = 'brightness(0.85)';
        sceneEl.appendChild(img);
      });

      // Text
      textEl.innerHTML = p.text.replace(/\n/g, '<br>');

      // Footer
      pageNumEl.textContent = idx === 0 ? '' : `Page ${idx} of ${PAGES.length - 1}`;
      prevBtn.disabled = idx === 0;
      nextBtn.textContent = p.isLast ? 'Read Again! 🌟' : 'Next →';

      if (p.isLast) spawnConfetti();
    }

    function spawnConfetti() {
      for (let i = 0; i < 70; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.width  = (8 + Math.random() * 10) + 'px';
        el.style.height = el.style.width;
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay   = (Math.random() * 0.8) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    nextBtn.addEventListener('click', () => {
      if (current === PAGES.length - 1) { current = 0; }
      else { current++; }
      render(current);
    });

    prevBtn.addEventListener('click', () => {
      if (current > 0) { current--; render(current); }
    });

    render(0);
  </script>
</body>
</html>
