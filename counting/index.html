<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count the Ponies!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      transition: background 0.5s;
      touch-action: manipulation;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.18);
      margin-bottom: 14px;
    }

    /* Mode tabs */
    #modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .mode-btn {
      border: none;
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      background: rgba(255,255,255,0.35);
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, background 0.15s;
    }

    .mode-btn:hover { transform: scale(1.06); }

    .mode-btn.active {
      background: white;
      color: #7b1fa2;
      text-shadow: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    /* Scene */
    #scene {
      position: relative;
      container-type: inline-size;
      width: 100%;
      max-width: 700px;
      aspect-ratio: 700 / 360;
      border-radius: 28px;
      background: rgba(255,255,255,0.35);
      border: 3px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
      margin-bottom: 22px;
    }

    .pony {
      position: absolute;
      width: 12.857%;
      aspect-ratio: 1;
      object-fit: contain;
      animation: pop-in 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes pop-in {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      70%  { transform: scale(1.15) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .pony.gone {
      animation: pop-in 0.3s cubic-bezier(.36,.07,.19,.97) both,
                 fade-away 0.6s ease 1.2s forwards;
    }

    @keyframes fade-away {
      to { opacity: 0.25; filter: grayscale(1); }
    }

    .gone-mark {
      position: absolute;
      font-size: 6.9cqw;
      font-weight: 900;
      color: #d32f2f;
      text-shadow: 0 0 6px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      animation: mark-in 0.3s ease 1.6s forwards;
    }

    @keyframes mark-in {
      from { opacity: 0; transform: scale(2); }
      to   { opacity: 1; transform: scale(1); }
    }

    #plus-sign {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 10.3cqw;
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.18);
      pointer-events: none;
    }

    /* Question */
    #question {
      font-size: 1.9rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 1px 2px 0 rgba(0,0,0,0.2);
      margin-bottom: 20px;
      text-align: center;
    }

    /* Answer buttons */
    #choices {
      display: flex;
      gap: 18px;
      margin-bottom: 20px;
    }

    .choice-btn {
      width: clamp(84px, 26vw, 110px);
      aspect-ratio: 1;
      border-radius: 22px;
      border: none;
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 900;
      cursor: pointer;
      background: white;
      color: #5e35b1;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      transition: transform 0.1s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding-top: 6px;
    }

    .choice-letter {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      line-height: 1;
      margin-bottom: 2px;
    }

    .choice-btn:hover:not(:disabled) { transform: scale(1.1); }
    .choice-btn:disabled { cursor: default; }

    .choice-btn.correct {
      background: #a5d6a7;
      color: #1b5e20;
      animation: correct-bounce 0.4s cubic-bezier(.36,.07,.19,.97);
    }

    .choice-btn.wrong {
      background: #ef9a9a;
      color: #7f0000;
      animation: wrong-shake 0.35s ease;
    }

    @keyframes correct-bounce {
      0%,100% { transform: scale(1); }
      40%      { transform: scale(1.2); }
    }

    @keyframes wrong-shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    /* Next button */
    #next-btn {
      display: none;
      background: white;
      color: #7b1fa2;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    #next-btn:hover { transform: scale(1.06); }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -12px;
      border-radius: 3px;
      animation: fall linear forwards;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      h1 { font-size: 1.6rem; text-align: center; }
      #modes { gap: 8px; }
      .mode-btn { padding: 8px 14px; font-size: 0.95rem; }
      #scene { border-radius: 18px; }
      #question { font-size: 1.5rem; margin-bottom: 14px; }
      #choices { gap: 12px; }
    }
  </style>
</head>
<body>

  <h1>Count the Ponies! 🌟</h1>
  <div id="modes">
    <button class="mode-btn active" data-mode="count">1️⃣ Counting</button>
    <button class="mode-btn" data-mode="add">➕ Adding</button>
    <button class="mode-btn" data-mode="sub">➖ Taking Away</button>
  </div>
  <div id="scene"></div>
  <div id="question"></div>
  <div id="choices"></div>
  <button id="next-btn">Next ponies! →</button>

  <script>
    const CHARACTERS = [
      { img: '../tictactoe/images/twilight.png',   name: 'Twilight'   },
      { img: '../tictactoe/images/luna.png',       name: 'Luna'       },
      { img: '../tictactoe/images/celestia.png',   name: 'Celestia'   },
      { img: '../tictactoe/images/applejack.png',  name: 'Applejack'  },
      { img: '../tictactoe/images/sunset.png',     name: 'Sunset'     },
      { img: '../tictactoe/images/starlight.png',  name: 'Starlight'  },
      { img: '../tictactoe/images/trixie.png',     name: 'Trixie'     },
      { img: '../tictactoe/images/fluttershy.png', name: 'Fluttershy' },
      { img: '../tictactoe/images/rarity.png',     name: 'Rarity'     },
      { img: '../tictactoe/images/cadance.png',    name: 'Cadance'    },
    ];

    const BG_GRADIENTS = [
      'linear-gradient(135deg, #f48fb1, #ce93d8)',
      'linear-gradient(135deg, #80deea, #80cbc4)',
      'linear-gradient(135deg, #ffe082, #ffab91)',
      'linear-gradient(135deg, #a5d6a7, #80deea)',
      'linear-gradient(135deg, #b39ddb, #90caf9)',
      'linear-gradient(135deg, #f48fb1, #90caf9)',
      'linear-gradient(135deg, #ffcc80, #ef9a9a)',
      'linear-gradient(135deg, #80cbc4, #b39ddb)',
    ];

    const CONFETTI_COLORS = ['#ff6f61','#ffd200','#6dd5ed','#a8e063','#f7971e','#c471ed','#12c2e9'];

    const scene     = document.getElementById('scene');
    const question  = document.getElementById('question');
    const choices   = document.getElementById('choices');
    const nextBtn   = document.getElementById('next-btn');

    // 10 grid slots (5 cols × 2 rows), centers within 700×360 scene
    const SLOTS = [];
    for (let row = 0; row < 2; row++) {
      for (let col = 0; col < 5; col++) {
        SLOTS.push({ cx: 70 + col * 120, cy: 90 + row * 180 });
      }
    }

    let mode = 'count';
    let lastCount = -1;
    let lastCharIdx = -1;

    const HEADINGS = {
      count: 'Count the Ponies! 🌟',
      add:   'Adding Ponies! ➕',
      sub:   'Ponies Fly Away! ➖',
    };

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelector('h1').textContent = HEADINGS[mode];
        newRound();
      });
    });

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function pickCount() {
      let n;
      do { n = rand(1, 10); } while (n === lastCount);
      return n;
    }

    function pickChar() {
      let i;
      do { i = rand(0, CHARACTERS.length - 1); } while (i === lastCharIdx);
      return i;
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function buildChoices(correct) {
      const wrong = new Set();
      while (wrong.size < 2) {
        const n = rand(1, 10);
        if (n !== correct) wrong.add(n);
      }
      return shuffle([correct, ...wrong]);
    }

    function placePony(char, slot, delay) {
      const img = document.createElement('img');
      img.src = char.img;
      img.alt = char.name;
      img.className = 'pony';
      const x = slot.cx - 45 + rand(-22, 22);
      const y = slot.cy - 45 + rand(-22, 22);
      img.style.left = (x / 7) + '%';
      img.style.top  = (y / 3.6) + '%';
      img.style.animationDelay = delay + 's';
      scene.appendChild(img);
      return { img, x, y };
    }

    function countRound() {
      const count   = pickCount();
      const charIdx = pickChar();
      lastCount   = count;
      lastCharIdx = charIdx;
      const char  = CHARACTERS[charIdx];

      shuffle(SLOTS).slice(0, count).forEach((slot, i) => placePony(char, slot, i * 0.07));

      const plural = count === 1 ? char.name : char.name + 's';
      question.textContent = `How many ${plural}?`;
      return count;
    }

    // Left group in columns 0–1, right group in columns 3–4, "+" in the middle
    function addRound() {
      const a = rand(1, 4);
      const b = rand(1, 4);
      const idxA = pickChar();
      let idxB;
      do { idxB = rand(0, CHARACTERS.length - 1); } while (idxB === idxA);
      lastCharIdx = idxA;

      const leftSlots  = SLOTS.filter(s => s.cx < 250);
      const rightSlots = SLOTS.filter(s => s.cx > 400);
      shuffle(leftSlots).slice(0, a).forEach((slot, i) => placePony(CHARACTERS[idxA], slot, i * 0.07));
      shuffle(rightSlots).slice(0, b).forEach((slot, i) => placePony(CHARACTERS[idxB], slot, (a + i) * 0.07));

      const plus = document.createElement('div');
      plus.id = 'plus-sign';
      plus.textContent = '+';
      scene.appendChild(plus);

      question.textContent = `${a} + ${b} = ?`;
      return a + b;
    }

    function subRound() {
      const a = rand(2, 8);
      const b = rand(1, a - 1);
      const charIdx = pickChar();
      lastCharIdx = charIdx;
      const char = CHARACTERS[charIdx];

      const slots = shuffle(SLOTS).slice(0, a);
      slots.forEach((slot, i) => {
        const { img, x, y } = placePony(char, slot, i * 0.07);
        if (i >= a - b) {
          img.classList.add('gone');
          const mark = document.createElement('div');
          mark.className = 'gone-mark';
          mark.textContent = '✖';
          mark.style.left = ((x + 26) / 7) + '%';
          mark.style.top  = ((y + 16) / 3.6) + '%';
          scene.appendChild(mark);
        }
      });

      question.textContent = `${a} − ${b} = ?`;
      return a - b;
    }

    function newRound() {
      document.body.style.background = BG_GRADIENTS[rand(0, BG_GRADIENTS.length - 1)];
      scene.innerHTML = '';

      const answer = mode === 'add' ? addRound() : mode === 'sub' ? subRound() : countRound();

      const nums = buildChoices(answer);
      choices.innerHTML = '';
      const LABELS = ['A', 'B', 'C'];
      nums.forEach((n, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-letter">${LABELS[i]}</span>${n}`;
        btn.dataset.value = n;
        btn.addEventListener('click', () => handleAnswer(btn, n, answer));
        choices.appendChild(btn);
      });

      nextBtn.style.display = 'none';
    }

    function handleAnswer(btn, chosen, correct) {
      // Disable all buttons
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      if (chosen === correct) {
        btn.classList.add('correct');
        spawnConfetti();
      } else {
        btn.classList.add('wrong');
        // Highlight the correct one
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (Number(b.dataset.value) === correct) b.classList.add('correct');
        });
      }

      nextBtn.style.display = 'inline-block';
    }

    function spawnConfetti() {
      for (let i = 0; i < 70; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.width  = (8 + Math.random() * 10) + 'px';
        el.style.height = el.style.width;
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay   = (Math.random() * 0.5) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    nextBtn.addEventListener('click', newRound);
    newRound();
  </script>
</body>
</html>
