<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pony Memory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 50%, #e0f7fa 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      font-size: 2.2rem;
      color: #7b1fa2;
      text-shadow: 2px 2px 0 #fff;
      margin-bottom: 6px;
    }

    #subtitle {
      font-size: 1rem;
      color: #9c27b0;
      margin-bottom: 18px;
      font-weight: 600;
    }

    #board {
      display: grid;
      grid-template-columns: 36px repeat(5, 130px);
      gap: 12px;
    }

    .board-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: #7b1fa2;
      opacity: 0.7;
    }

    .card-coord {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.7rem;
      font-weight: 900;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.03em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      z-index: 2;
      pointer-events: none;
    }

    /* --- Card shell --- */
    .card {
      width: 130px;
      height: 170px;
      perspective: 600px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(.4,0,.2,1);
      border-radius: 16px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    /* --- Back face (rainbow gradient card back) --- */
    .card-back, .card-front {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      background: linear-gradient(135deg, #ff6f91, #ff9671, #ffd670, #70d6ff, #e9c9ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      border: 3px solid rgba(255,255,255,0.6);
    }

    /* --- Front face --- */
    .card-front {
      background: white;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      border: 3px solid #e1bee7;
    }

    .card-front img {
      width: 86px;
      height: 86px;
      object-fit: contain;
    }

    .card-front .char-name {
      font-size: 0.7rem;
      font-weight: 800;
      color: #6a1b9a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* --- Matched state --- */
    .card.matched .card-front {
      border-color: #ab47bc;
      background: #f3e5f5;
      animation: matched-pop 0.3s cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes matched-pop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* --- No-match shake --- */
    .card.shake .card-inner {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25%       { transform: rotateY(180deg) translateX(-6px); }
      75%       { transform: rotateY(180deg) translateX(6px); }
    }

    /* --- Pairs counter --- */
    #counter {
      margin-top: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #7b1fa2;
    }

    /* --- Win overlay --- */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }

    #overlay.show { display: flex; }

    #overlay-card {
      background: white;
      border-radius: 28px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      animation: pop-in 0.4s cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes pop-in {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    #overlay-card .big-emoji { font-size: 4rem; }
    #overlay-card h2 { font-size: 2rem; color: #7b1fa2; margin: 10px 0 6px; }
    #overlay-card p  { font-size: 1.1rem; color: #9c27b0; margin-bottom: 24px; }

    #play-again {
      background: #ab47bc;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #play-again:hover { transform: scale(1.06); }

    /* --- Confetti --- */
    .confetti {
      position: fixed;
      top: -12px;
      border-radius: 3px;
      animation: fall linear forwards;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Pony Memory</h1>
  <div id="subtitle">Find all the matching pairs! 🌈</div>

  <div id="board"></div>

  <div id="counter">Pairs found: <span id="pairs">0</span> / 10</div>

  <div id="overlay">
    <div id="overlay-card">
      <div class="big-emoji">🎉</div>
      <h2>You found them all!</h2>
      <p>Amazing memory!</p>
      <button id="play-again">Play Again!</button>
    </div>
  </div>

  <script>
    const CHARACTERS = [
      { img: '../tictactoe/images/twilight.png',  name: 'Twilight'  },
      { img: '../tictactoe/images/luna.png',      name: 'Luna'      },
      { img: '../tictactoe/images/celestia.png',  name: 'Celestia'  },
      { img: '../tictactoe/images/applejack.png', name: 'Applejack' },
      { img: '../tictactoe/images/sunset.png',    name: 'Sunset'    },
      { img: '../tictactoe/images/starlight.png', name: 'Starlight' },
      { img: '../tictactoe/images/trixie.png',    name: 'Trixie'    },
      { img: '../tictactoe/images/fluttershy.png',name: 'Fluttershy'},
      { img: '../tictactoe/images/rarity.png',    name: 'Rarity'    },
      { img: '../tictactoe/images/cadance.png',   name: 'Cadance'   },
    ];

    const CONFETTI_COLORS = ['#ff6f61','#ffd200','#6dd5ed','#a8e063','#f7971e','#c471ed','#12c2e9'];

    const board    = document.getElementById('board');
    const pairsEl  = document.getElementById('pairs');
    const overlay  = document.getElementById('overlay');
    const playAgain = document.getElementById('play-again');

    let cards = [];
    let cardEls = [];
    let flipped = [];   // indices of currently face-up unmatched cards
    let matched = new Set();
    let locked = false;

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    const ROW_LABELS = ['A', 'B', 'C', 'D'];

    function makeLabel(text) {
      const el = document.createElement('div');
      el.className = 'board-label';
      el.textContent = text;
      return el;
    }

    function buildBoard() {
      board.innerHTML = '';
      cardEls = [];
      flipped = [];
      matched = new Set();
      locked = false;
      pairsEl.textContent = '0';
      overlay.classList.remove('show');

      cards = shuffle([...CHARACTERS, ...CHARACTERS].map((c, i) => ({ ...c, uid: i })));

      // Column header row: empty corner + 1–5
      board.appendChild(makeLabel(''));
      for (let c = 1; c <= 5; c++) board.appendChild(makeLabel(c));

      cards.forEach((char, idx) => {
        const col = idx % 5;
        const row = Math.floor(idx / 5);
        const coord = ROW_LABELS[row] + (col + 1);

        // Row label at start of each row
        if (col === 0) board.appendChild(makeLabel(ROW_LABELS[row]));

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-back">🌟<span class="card-coord">${coord}</span></div>
            <div class="card-front">
              <img src="${char.img}" alt="${char.name}">
              <span class="char-name">${char.name}</span>
            </div>
          </div>`;
        card.addEventListener('click', () => flipCard(idx));
        board.appendChild(card);
        cardEls.push(card);
      });
    }

    function flipCard(idx) {
      if (locked || matched.has(idx) || flipped.includes(idx)) return;
      cardEls[idx].classList.add('flipped');
      flipped.push(idx);

      if (flipped.length === 2) {
        locked = true;
        checkMatch();
      }
    }

    function checkMatch() {
      const [a, b] = flipped;
      if (cards[a].name === cards[b].name) {
        matched.add(a);
        matched.add(b);
        cardEls[a].classList.add('matched');
        cardEls[b].classList.add('matched');
        pairsEl.textContent = matched.size / 2;
        flipped = [];
        locked = false;
        if (matched.size === 20) setTimeout(showWin, 400);
      } else {
        cardEls[a].classList.add('shake');
        cardEls[b].classList.add('shake');
        setTimeout(() => {
          cardEls[a].classList.remove('flipped', 'shake');
          cardEls[b].classList.remove('flipped', 'shake');
          flipped = [];
          locked = false;
        }, 900);
      }
    }

    function showWin() {
      overlay.classList.add('show');
      spawnConfetti();
    }

    function spawnConfetti() {
      for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.width  = (8 + Math.random() * 10) + 'px';
        el.style.height = el.style.width;
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay   = (Math.random() * 0.8) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    playAgain.addEventListener('click', buildBoard);
    buildBoard();
  </script>
</body>
</html>
