<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count the Ponies!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      transition: background 0.5s;
      touch-action: manipulation;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.18);
      margin-bottom: 14px;
    }

    /* Mode tabs */
    #modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .mode-btn {
      border: none;
      border-radius: 50px;
      padding: 10px 22px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      background: rgba(255,255,255,0.35);
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, background 0.15s;
    }

    .mode-btn:hover { transform: scale(1.06); }

    .mode-btn.active {
      background: white;
      color: #7b1fa2;
      text-shadow: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    /* Scene */
    #scene {
      position: relative;
      container-type: inline-size;
      width: 100%;
      max-width: 700px;
      aspect-ratio: 700 / 360;
      border-radius: 28px;
      background: rgba(255,255,255,0.35);
      border: 3px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3%;
    }

    /* A flex-wrap crowd of ponies — used by counting and subtracting, and
       as each half of an addition. No fixed slot count, so any number fits. */
    .group {
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 2%;
      width: 100%;
      height: 100%;
    }

    .eq-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 1%;
    }

    .eq-row .group { flex: 1 1 0; min-width: 0; }

    .eq-sign {
      flex: 0 0 auto;
      font-size: 10.5cqw;
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.18);
      padding: 0 1%;
    }

    .pony-slot {
      position: relative;
      container-type: inline-size;
      flex: 0 0 auto;
    }

    .pony {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: pop-in 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes pop-in {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      70%  { transform: scale(1.15) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .pony.gone {
      animation: pop-in 0.3s cubic-bezier(.36,.07,.19,.97) both,
                 fade-away 0.6s ease 1.2s forwards;
    }

    @keyframes fade-away {
      to { opacity: 0.25; filter: grayscale(1); }
    }

    .gone-mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55cqw;
      font-weight: 900;
      color: #d32f2f;
      text-shadow: 0 0 6px rgba(255,255,255,0.8);
      pointer-events: none;
      opacity: 0;
      animation: mark-in 0.3s ease 1.6s forwards;
    }

    @keyframes mark-in {
      from { opacity: 0; transform: scale(2); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Multiplication shows an actual rows × cols array — the clearest way
       to picture a times-table fact, and it scales to any grid size. */
    .array-grid {
      display: grid;
      width: 92%;
      height: 92%;
      gap: 4%;
    }

    .array-grid .pony {
      animation-fill-mode: both;
      /* grid items default to min-height/width:auto, which lets a tall,
         narrow grid (e.g. 5 rows × 2 cols) blow out past the fixed box */
      min-width: 0;
      min-height: 0;
    }

    /* Question */
    #question {
      font-size: 1.9rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 1px 2px 0 rgba(0,0,0,0.2);
      margin-bottom: 20px;
      text-align: center;
    }

    /* Answer buttons */
    #choices {
      display: flex;
      gap: 18px;
      margin-bottom: 20px;
    }

    .choice-btn {
      width: clamp(84px, 26vw, 110px);
      aspect-ratio: 1;
      border-radius: 22px;
      border: none;
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 900;
      cursor: pointer;
      background: white;
      color: #5e35b1;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      transition: transform 0.1s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding-top: 6px;
    }

    .choice-letter {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.45;
      line-height: 1;
      margin-bottom: 2px;
    }

    .choice-btn:hover:not(:disabled) { transform: scale(1.1); }
    .choice-btn:disabled { cursor: default; }

    .choice-btn.correct {
      background: #a5d6a7;
      color: #1b5e20;
      animation: correct-bounce 0.4s cubic-bezier(.36,.07,.19,.97);
    }

    .choice-btn.wrong {
      background: #ef9a9a;
      color: #7f0000;
      animation: wrong-shake 0.35s ease;
    }

    @keyframes correct-bounce {
      0%,100% { transform: scale(1); }
      40%      { transform: scale(1.2); }
    }

    @keyframes wrong-shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    /* Next button */
    #next-btn {
      display: none;
      background: white;
      color: #7b1fa2;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    #next-btn:hover { transform: scale(1.06); }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -12px;
      border-radius: 3px;
      animation: fall linear forwards;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      h1 { font-size: 1.6rem; text-align: center; }
      #modes { gap: 8px; }
      .mode-btn { padding: 8px 14px; font-size: 0.95rem; }
      #scene { border-radius: 18px; }
      #question { font-size: 1.5rem; margin-bottom: 14px; }
      #choices { gap: 12px; }
    }
  </style>
</head>
<body>

  <h1>Count the Ponies! 🌟</h1>
  <div id="modes">
    <button class="mode-btn active" data-mode="count">1️⃣ Counting</button>
    <button class="mode-btn" data-mode="add">➕ Adding</button>
    <button class="mode-btn" data-mode="sub">➖ Taking Away</button>
    <button class="mode-btn" data-mode="mult">✖️ Multiplying</button>
  </div>
  <div id="scene"></div>
  <div id="question"></div>
  <div id="choices"></div>
  <button id="next-btn">Next ponies! →</button>

  <script>
    const CHARACTERS = [
      { img: '../tictactoe/images/twilight.png',   name: 'Twilight'   },
      { img: '../tictactoe/images/luna.png',       name: 'Luna'       },
      { img: '../tictactoe/images/celestia.png',   name: 'Celestia'   },
      { img: '../tictactoe/images/applejack.png',  name: 'Applejack'  },
      { img: '../tictactoe/images/sunset.png',     name: 'Sunset'     },
      { img: '../tictactoe/images/starlight.png',  name: 'Starlight'  },
      { img: '../tictactoe/images/trixie.png',     name: 'Trixie'     },
      { img: '../tictactoe/images/fluttershy.png', name: 'Fluttershy' },
      { img: '../tictactoe/images/rarity.png',     name: 'Rarity'     },
      { img: '../tictactoe/images/cadance.png',    name: 'Cadance'    },
    ];

    const BG_GRADIENTS = [
      'linear-gradient(135deg, #f48fb1, #ce93d8)',
      'linear-gradient(135deg, #80deea, #80cbc4)',
      'linear-gradient(135deg, #ffe082, #ffab91)',
      'linear-gradient(135deg, #a5d6a7, #80deea)',
      'linear-gradient(135deg, #b39ddb, #90caf9)',
      'linear-gradient(135deg, #f48fb1, #90caf9)',
      'linear-gradient(135deg, #ffcc80, #ef9a9a)',
      'linear-gradient(135deg, #80cbc4, #b39ddb)',
    ];

    const CONFETTI_COLORS = ['#ff6f61','#ffd200','#6dd5ed','#a8e063','#f7971e','#c471ed','#12c2e9'];

    const scene     = document.getElementById('scene');
    const question  = document.getElementById('question');
    const choices   = document.getElementById('choices');
    const nextBtn   = document.getElementById('next-btn');

    // How big (as % of scene width) a pony should be so this many of them
    // still fit the fixed scene box without a rigid slot grid.
    const SIZE_TIERS = [[3, 22], [6, 17], [9, 14], [12, 12], [16, 10], [20, 8.5], [25, 7.5]];
    function ponySize(n) {
      for (const [max, pct] of SIZE_TIERS) if (n <= max) return pct;
      return SIZE_TIERS[SIZE_TIERS.length - 1][1];
    }

    let mode = 'count';
    let lastCount = -1;
    let lastCharIdx = -1;
    let lastFact = '';

    const HEADINGS = {
      count: 'Count the Ponies! 🌟',
      add:   'Adding Ponies! ➕',
      sub:   'Ponies Fly Away! ➖',
      mult:  'Multiplying Ponies! ✖️',
    };

    const CHOICE_RANGE = {
      count: [1, 10],
      add:   [1, 14],
      sub:   [0, 12],
      mult:  [1, 30],
    };

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        lastFact = '';
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelector('h1').textContent = HEADINGS[mode];
        newRound();
      });
    });

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function pickCount() {
      let n;
      do { n = rand(1, 10); } while (n === lastCount);
      return n;
    }

    function pickChar() {
      let i;
      do { i = rand(0, CHARACTERS.length - 1); } while (i === lastCharIdx);
      return i;
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    // Wrong answers land near the real one so they're plausible, not just
    // any number — but never equal to it, and never outside the valid range.
    function buildChoices(correct, [min, max]) {
      const lo = Math.max(min, correct - 8);
      const hi = Math.min(max, correct + 8);
      const wrong = new Set();
      while (wrong.size < 2) {
        const n = rand(lo, hi);
        if (n !== correct) wrong.add(n);
      }
      return shuffle([correct, ...wrong]);
    }

    function makeSlot(char, size, delay) {
      const slot = document.createElement('div');
      slot.className = 'pony-slot';
      slot.style.width = size + '%';
      slot.style.aspectRatio = '1';
      const img = document.createElement('img');
      img.src = char.img;
      img.alt = char.name;
      img.className = 'pony';
      img.style.animationDelay = delay + 's';
      slot.appendChild(img);
      return slot;
    }

    function countRound() {
      const count   = pickCount();
      const charIdx = pickChar();
      lastCount   = count;
      lastCharIdx = charIdx;
      const char  = CHARACTERS[charIdx];

      const group = document.createElement('div');
      group.className = 'group';
      const size = ponySize(count);
      for (let i = 0; i < count; i++) group.appendChild(makeSlot(char, size, i * 0.06));
      scene.appendChild(group);

      const plural = count === 1 ? char.name : char.name + 's';
      question.textContent = `How many ${plural}?`;
      return count;
    }

    function addRound() {
      let a, b;
      do { a = rand(1, 6); b = rand(1, 6); } while (`${a}+${b}` === lastFact);
      lastFact = `${a}+${b}`;

      const idxA = pickChar();
      let idxB;
      do { idxB = rand(0, CHARACTERS.length - 1); } while (idxB === idxA);
      lastCharIdx = idxA;

      const row = document.createElement('div');
      row.className = 'eq-row';
      const left = document.createElement('div');
      left.className = 'group';
      const right = document.createElement('div');
      right.className = 'group';
      const size = ponySize(a + b);
      for (let i = 0; i < a; i++) left.appendChild(makeSlot(CHARACTERS[idxA], size, i * 0.06));
      for (let i = 0; i < b; i++) right.appendChild(makeSlot(CHARACTERS[idxB], size, (a + i) * 0.06));

      const sign = document.createElement('div');
      sign.className = 'eq-sign';
      sign.textContent = '+';

      row.append(left, sign, right);
      scene.appendChild(row);

      question.textContent = `${a} + ${b} = ?`;
      return a + b;
    }

    function subRound() {
      let a, b;
      do { a = rand(3, 12); b = rand(1, a - 1); } while (`${a}-${b}` === lastFact);
      lastFact = `${a}-${b}`;

      const charIdx = pickChar();
      lastCharIdx = charIdx;
      const char = CHARACTERS[charIdx];

      const group = document.createElement('div');
      group.className = 'group';
      const size = ponySize(a);
      for (let i = 0; i < a; i++) {
        const slot = makeSlot(char, size, i * 0.06);
        if (i >= a - b) {
          slot.querySelector('.pony').classList.add('gone');
          const mark = document.createElement('div');
          mark.className = 'gone-mark';
          mark.textContent = '✖';
          slot.appendChild(mark);
        }
        group.appendChild(slot);
      }
      scene.appendChild(group);

      question.textContent = `${a} − ${b} = ?`;
      return a - b;
    }

    function multRound() {
      let rows, cols;
      do { rows = rand(2, 5); cols = rand(2, 5); } while (`${rows}x${cols}` === lastFact);
      lastFact = `${rows}x${cols}`;

      const charIdx = pickChar();
      lastCharIdx = charIdx;
      const char = CHARACTERS[charIdx];

      const grid = document.createElement('div');
      grid.className = 'array-grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      for (let i = 0; i < rows * cols; i++) {
        const img = document.createElement('img');
        img.src = char.img;
        img.alt = char.name;
        img.className = 'pony';
        img.style.animationDelay = (i * 0.04) + 's';
        grid.appendChild(img);
      }
      scene.appendChild(grid);

      question.textContent = `${rows} × ${cols} = ?`;
      return rows * cols;
    }

    const ROUND_FN = { count: countRound, add: addRound, sub: subRound, mult: multRound };

    function newRound() {
      document.body.style.background = BG_GRADIENTS[rand(0, BG_GRADIENTS.length - 1)];
      scene.innerHTML = '';

      const answer = ROUND_FN[mode]();

      const nums = buildChoices(answer, CHOICE_RANGE[mode]);
      choices.innerHTML = '';
      const LABELS = ['A', 'B', 'C'];
      nums.forEach((n, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-letter">${LABELS[i]}</span>${n}`;
        btn.dataset.value = n;
        btn.addEventListener('click', () => handleAnswer(btn, n, answer));
        choices.appendChild(btn);
      });

      nextBtn.style.display = 'none';
    }

    function handleAnswer(btn, chosen, correct) {
      // Disable all buttons
      choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      if (chosen === correct) {
        btn.classList.add('correct');
        spawnConfetti();
      } else {
        btn.classList.add('wrong');
        // Highlight the correct one
        choices.querySelectorAll('.choice-btn').forEach(b => {
          if (Number(b.dataset.value) === correct) b.classList.add('correct');
        });
      }

      nextBtn.style.display = 'inline-block';
    }

    function spawnConfetti() {
      for (let i = 0; i < 70; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.width  = (8 + Math.random() * 10) + 'px';
        el.style.height = el.style.width;
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay   = (Math.random() * 0.5) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    nextBtn.addEventListener('click', newRound);
    newRound();
  </script>
</body>
</html>
